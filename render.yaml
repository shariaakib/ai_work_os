services:
  - type: web
    name: ai-work-os
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.server:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/health
    autoDeploy: true